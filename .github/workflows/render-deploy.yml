name: Website release checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-checks-${{ github.ref }}
  cancel-in-progress: true

# Render's connected GitHub integration deploys after these checks pass.
# Do not trigger a second deployment with a separate, expiring API credential.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run check
      - run: npm test -- server/solarAssistant.test.ts server/solarAssistantKnowledge.test.ts
      - run: npm run build
